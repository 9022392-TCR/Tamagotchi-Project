<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tamagotchi</title>
    <link rel="stylesheet" href="main.css">
    <link href='https://fonts.googleapis.com/css?family=VT323' rel='stylesheet'>
</head>
<body>
    <div class="game">
        <div class="stats">
            <div class="hunger">
                <div>HUNGER</div>
                <div class="num" id="stat1"></div>
            </div>
            <div class="sleep">
                <div>SLEEP</div>
                <div class="num" id="stat2"></div>
            </div>
            <div class="fun">
                <div>FUN</div>
                <div class="num" id="stat3"></div>
            </div>
            <div class="age">
                <div>AGE</div>
                <div class="num" id="stat4"></div>
            </div>
        </div>
        <div class="msg" id="end"></div>
        <div class="thing">
            <img src="sprites/tamagotchi.png" id="entity" alt="Tamagotchi" height="128px" width="128px">
        </div>
        <div id="chat"></div>
        <div class=controls>
            <div class="bttn" onclick="feed()">FEED</div>
            <div class="bttn" onclick="nap()">NAP</div>
            <div class="bttn" onclick="play()">PLAY</div>
        </div>
    </div>

    <audio id="music" src="Track.mp3"></audio>

    <script src="script.js"></script>
</body>
</html>
