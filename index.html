<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tamagotchi</title>
    <link rel="stylesheet" href="main.css">
    <link href='https://fonts.googleapis.com/css?family=VT323' rel='stylesheet'>
    <script src="script.js"></script>
</head>
<body>
    <div class="game">
        <div class="stats">
            <div class="hunger">HUNGER:100</div>
            <div class="sleep">SLEEP:100</div>
            <div class="fun">FUN:100</div>
        </div>
        <div class="thing"><img src="sprites/tamagotchi.png" alt="Tamagotchi" width="128px"></div>
        <div class=controls>
            <div class="bttn1">FEED</div>
            <div class="bttn2">NAP</div>
            <div class="bttn3">PLAY</div>
        </div>
    </div>
</body>
</html>
